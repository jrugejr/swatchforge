name = "swatchforge-studio-api"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Run: npx wrangler d1 create swatchforge-studio
# Replace the database_id below with the result before deploying.
[[d1_databases]]
binding = "DB"
database_name = "swatchforge-studio"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Run: npx wrangler r2 bucket create swatchforge-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "swatchforge-photos"

[vars]
# Set to your published GitHub Pages origin, no trailing slash.
FRONTEND_ORIGIN = "https://jrugejr.github.io"
